name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Restore apt cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Restore pip cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') || 'no-pyproject' }}
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck -S warning claude/hooks/*.sh claude/hooks/tests/*.sh claude/git-hooks/* scripts/*.sh scripts/cloud/*.sh tests/*.sh
      - name: Install ruff
        if: hashFiles('pyproject.toml') != ''
        run: pip install --user ruff
      - name: Run ruff
        if: hashFiles('pyproject.toml') != ''
        run: ruff check claude/hooks/

  selftests:
    name: selftests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
          - os: macos
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # tests/test_install.sh seeds old kit files from history
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Run git-hook and installer tests
        run: |
          for t in claude/hooks/tests/test_*.sh tests/test_*.sh; do
            bash "$t"
          done
      - name: Run python hook tests
        run: python -m pip install --user pytest && python -m pytest -q claude/hooks/tests
      - name: Run docs-writer tests
        run: |
          python -m pip install --user markdown pygments playwright
          python -m playwright install --with-deps chromium  # test_interactive.py; prints SKIP without it
          bash claude/skills/docs-writer/tests/test_render.sh
          bash claude/skills/docs-writer/tests/test_richness_threshold.sh

  install-smoke:
    name: install-smoke
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Run install.sh into scratch HOME
        run: |
          export HOME="$(mktemp -d)"
          bash scripts/install.sh --no-serena
