<!-- snippet:tutorial-cards
     Card grid linking to sections of the page. Clicking a card scrolls to the
     heading whose id is the card's "anchor".

     The page supplies the cards as a JSON child of the placeholder. "level"
     is optional (easy | med | hard colours the first badge); "color" is an
     optional CSS colour for the hover accent.
       <div data-snippet="tutorial-cards">
       <script type="application/json">
       [{"anchor": "first-steps", "label": "TUTORIAL 1", "title": "First steps",
         "desc": "Install and run the hello-world example.", "color": "#10b981",
         "level": "easy", "badges": ["Easy", "~5 min"]}]
       </script>
       </div>
-->
<div class="pkit-tut-cards" data-snippet-mount="tutorial-cards">
  <style>
    .pkit-tut-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .pkit-tut-cards .pkit-tc-card {
      display: flex;
      flex-direction: column;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }
    .pkit-tut-cards .pkit-tc-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--card-color, var(--accent));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 200ms ease;
    }
    .pkit-tut-cards .pkit-tc-card:hover {
      border-color: var(--card-color, var(--accent));
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .pkit-tut-cards .pkit-tc-card:hover::before { transform: scaleX(1); }
    .pkit-tut-cards .pkit-tc-num {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--fg-subtle);
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }
    .pkit-tut-cards .pkit-tc-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--fg);
      margin: 0 0 0.5rem;
      line-height: 1.3;
    }
    .pkit-tut-cards .pkit-tc-desc {
      font-size: 0.85rem;
      color: var(--fg-muted);
      line-height: 1.4;
      margin: 0 0 0.8rem;
      flex: 1;
    }
    .pkit-tut-cards .pkit-tc-meta {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-top: auto;
    }
    .pkit-tut-cards .pkit-tc-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--bg);
      color: var(--fg-muted);
      border: 1px solid var(--border);
    }
    .pkit-tut-cards .pkit-tc-badge.diff-easy { color: var(--success); border-color: var(--success); }
    .pkit-tut-cards .pkit-tc-badge.diff-med  { color: var(--warn);    border-color: var(--warn); }
    .pkit-tut-cards .pkit-tc-badge.diff-hard { color: var(--danger);  border-color: var(--danger); }
    .pkit-tut-cards .pkit-tc-badge svg { width: 10px; height: 10px; }
    .pkit-tut-cards .pkit-tc-arrow {
      position: absolute;
      top: 1rem;
      right: 1rem;
      color: var(--fg-subtle);
      opacity: 0;
      transform: translateX(-4px);
      transition: all var(--transition);
    }
    .pkit-tut-cards .pkit-tc-card:hover .pkit-tc-arrow {
      opacity: 1;
      transform: translateX(0);
      color: var(--card-color, var(--accent));
    }
  </style>

</div>

<script>
(function() {
  'use strict';
  const arrow = '<svg class="pkit-tc-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  document.querySelectorAll('.pkit-tut-cards[data-snippet-mount="tutorial-cards"]').forEach(grid => {
    if (grid.dataset.pkitInit) return;
    grid.dataset.pkitInit = '1';
    const dataEl = grid.querySelector('script[type="application/json"]');
    if (!dataEl) return;
    JSON.parse(dataEl.textContent).forEach(c => {
      const card = document.createElement('a');
      card.className = 'pkit-tc-card';
      card.href = '#' + (c.anchor || '');
      if (c.color) card.style.setProperty('--card-color', c.color);
      const badges = (c.badges || []).map((b, i) =>
        `<span class="pkit-tc-badge${i === 0 && c.level ? ' diff-' + esc(c.level) : ''}">${esc(b)}</span>`).join('');
      card.innerHTML = arrow +
        (c.label ? `<div class="pkit-tc-num">${esc(c.label)}</div>` : '') +
        `<h3 class="pkit-tc-title">${esc(c.title)}</h3>` +
        (c.desc ? `<p class="pkit-tc-desc">${esc(c.desc)}</p>` : '') +
        (badges ? `<div class="pkit-tc-meta">${badges}</div>` : '');
      card.addEventListener('click', e => {
        const target = document.getElementById(c.anchor);
        if (!target) return;
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.pushState(null, '', '#' + c.anchor);
      });
      grid.appendChild(card);
    });
  });
})();
</script>
