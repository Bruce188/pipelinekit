<!-- snippet:playground-2col
     Side-by-side example explorer: two editable panes (e.g. input / output,
     before / after, config / result) with preset buttons that load a pair.
     An optional per-preset "note" (inline HTML allowed) shows under the panes.

     The page supplies the data as a JSON child of the placeholder:
       <div data-snippet="playground-2col">
       <script type="application/json">
       {"title": "Try the formatter",
        "left_label": "Input", "right_label": "Output",
        "presets": [{"label": "basic", "left": "a=1", "right": "a = 1",
                     "note": "Spaces are added around <code>=</code>."}]}
       </script>
       </div>
-->
<div class="pkit-pg2" data-snippet-mount="playground-2col">
  <style>
    .pkit-pg2 { margin: 1.5rem 0; padding: 1.5rem; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); }
    .pkit-pg2 .pkit-p2-title { font-size: 0.92rem; font-weight: 600; color: var(--fg); margin: 0 0 0.8rem; }
    .pkit-pg2 .pkit-p2-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    @media (max-width: 720px) { .pkit-pg2 .pkit-p2-cols { grid-template-columns: 1fr; } }
    .pkit-pg2 .pkit-p2-col { display: flex; flex-direction: column; gap: 0.4rem; }
    .pkit-pg2 .pkit-p2-col label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-subtle); font-weight: 600; }
    .pkit-pg2 textarea, .pkit-pg2 input[type="text"] { width: 100%; padding: 0.7rem 0.9rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 0.85rem; line-height: 1.5; resize: vertical; }
    .pkit-pg2 textarea:focus, .pkit-pg2 input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .pkit-pg2 textarea { min-height: 130px; }
    .pkit-pg2 .pkit-p2-output { margin-top: 1rem; padding: 0.9rem 1rem; background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius); }
    .pkit-pg2 .pkit-p2-evidence { font-size: 0.82rem; color: var(--fg-muted); line-height: 1.5; }
    .pkit-pg2 .pkit-p2-evidence code { background: var(--bg-elev); padding: 0.05rem 0.4rem; border-radius: var(--radius-sm); font-size: 0.78rem; border: 1px solid var(--border); }
    .pkit-pg2 .pkit-p2-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .pkit-pg2 .pkit-p2-preset { padding: 0.25rem 0.55rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--fg-muted); font-family: var(--sans); font-size: 0.72rem; cursor: pointer; transition: all var(--transition); }
    .pkit-pg2 .pkit-p2-preset:hover { color: var(--fg); border-color: var(--accent); }
    .pkit-pg2 .pkit-p2-preset.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  </style>

  <div data-p2-mount></div>

</div>

<script>
(function() {
  'use strict';
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  document.querySelectorAll('.pkit-pg2[data-snippet-mount="playground-2col"]').forEach(pg => {
    if (pg.dataset.pkitInit) return;
    pg.dataset.pkitInit = '1';
    const mount = pg.querySelector('[data-p2-mount]');
    const dataEl = pg.querySelector('script[type="application/json"]');
    if (!mount || !dataEl) return;
    const data = JSON.parse(dataEl.textContent);
    const presets = data.presets || [];
    const presetsHtml = presets.length ? '<div class="pkit-p2-presets">' +
      presets.map((p, i) => `<button class="pkit-p2-preset" data-preset-idx="${i}">${esc(p.label)}</button>`).join('') +
      '</div>' : '';
    mount.innerHTML = `
      ${data.title ? `<p class="pkit-p2-title">${esc(data.title)}</p>` : ''}
      ${presetsHtml}
      <div class="pkit-p2-cols">
        <div class="pkit-p2-col"><label>${esc(data.left_label || 'Before')}</label><textarea data-p2-left spellcheck="false"></textarea></div>
        <div class="pkit-p2-col"><label>${esc(data.right_label || 'After')}</label><textarea data-p2-right spellcheck="false"></textarea></div>
      </div>
      <div class="pkit-p2-output" data-p2-note hidden><div class="pkit-p2-evidence"></div></div>`;
    const left = mount.querySelector('[data-p2-left]');
    const right = mount.querySelector('[data-p2-right]');
    const note = mount.querySelector('[data-p2-note]');
    function load(i) {
      const p = presets[i];
      left.value = p.left || '';
      right.value = p.right || '';
      note.hidden = !p.note;
      note.firstElementChild.innerHTML = p.note || '';
      mount.querySelectorAll('.pkit-p2-preset').forEach((b, j) => b.classList.toggle('active', i === j));
    }
    mount.querySelectorAll('.pkit-p2-preset').forEach(b =>
      b.addEventListener('click', () => load(+b.dataset.presetIdx)));
    if (presets.length) load(0);
  });
})();
</script>
