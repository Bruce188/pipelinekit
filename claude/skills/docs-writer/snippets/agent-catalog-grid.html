<script>
(function() {
  'use strict';
  const roots = document.querySelectorAll('.pkit-akg[data-snippet-mount="agent-catalog-grid"]');
  const root = roots[roots.length - 1];
  if (!root || root.dataset.pkitInit) return;
  root.dataset.pkitInit = '1';

  const cards = Array.from(root.querySelectorAll('[data-agent-card]'));
  const emptyMsg = root.querySelector('.pkit-akg-empty-msg');
  const countEl = root.querySelector('.pkit-akg-count');
  const searchEl = root.querySelector('.pkit-akg-search');
  const chips = root.querySelectorAll('.pkit-akg-chip');
  let activeSection = 'all';
  let searchTerm = '';
  let debounceTimer = null;

  function applyFilters() {
    const q = searchTerm.toLowerCase();
    let visible = 0;
    cards.forEach(card => {
      const section = card.dataset.section || '';
      const name = (card.dataset.name || '').toLowerCase();
      const desc = (card.querySelector('p') || {}).textContent || '';
      const matchSection = activeSection === 'all' || section === activeSection;
      const matchSearch = !q || name.includes(q) || desc.toLowerCase().includes(q);
      const show = matchSection && matchSearch;
      card.hidden = !show;
      if (show) visible++;
    });
    if (emptyMsg) emptyMsg.style.display = visible === 0 ? 'block' : 'none';
    if (countEl) countEl.textContent = visible + ' of ' + cards.length + ' agents shown';
  }

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      activeSection = chip.dataset.section;
      chips.forEach(c => c.classList.toggle('active', c.dataset.section === activeSection));
      applyFilters();
    });
  });

  searchEl && searchEl.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      searchTerm = searchEl.value;
      applyFilters();
    }, 120);
  });

  applyFilters();
})();
</script>
