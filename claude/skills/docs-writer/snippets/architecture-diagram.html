<!-- snippet:architecture-diagram
     Layered architecture stack: one coloured band per layer, each holding
     chips with hover tooltips. Filter buttons dim every other layer.

     The page supplies the layers (top to bottom) as a JSON child of the
     placeholder. "count" and "tip" are optional; "color" is any CSS colour.
       <div data-snippet="architecture-diagram">
       <script type="application/json">
       {"layers": [
         {"name": "Clients", "color": "#10b981", "count": "2 apps",
          "chips": [{"label": "web", "tip": "React SPA"}, {"label": "cli"}]},
         {"name": "API", "color": "#3b82f6",
          "chips": [{"label": "gateway", "tip": "Auth and routing"}]}]}
       </script>
       </div>
-->
<div class="pkit-arch-diagram" data-snippet-mount="architecture-diagram">
  <style>
    .pkit-arch-diagram {
      margin: 1.5rem 0;
      padding: 1.5rem;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .pkit-arch-diagram .pkit-ad-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      align-items: center;
    }
    .pkit-arch-diagram .pkit-ad-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--fg-subtle);
      font-weight: 600;
    }
    .pkit-arch-diagram .pkit-ad-layer-btn {
      padding: 0.3rem 0.65rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--fg-muted);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .pkit-arch-diagram .pkit-ad-layer-btn .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .pkit-arch-diagram .pkit-ad-layer-btn:hover { color: var(--fg); border-color: var(--border-strong); }
    .pkit-arch-diagram .pkit-ad-layer-btn.active { color: var(--fg); border-color: var(--accent); background: var(--accent-soft); }

    .pkit-arch-diagram .pkit-ad-stack {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .pkit-arch-diagram .pkit-ad-layer {
      border-radius: var(--radius);
      padding: 0.9rem 1.1rem;
      transition: opacity var(--transition), transform var(--transition);
      border: 1px solid var(--border);
      position: relative;
    }
    .pkit-arch-diagram .pkit-ad-layer.dimmed {
      opacity: 0.25;
      filter: grayscale(40%);
    }
    .pkit-arch-diagram .pkit-ad-layer { background: linear-gradient(135deg, color-mix(in srgb, var(--layer-color, var(--accent)) 12%, var(--bg)) 0%, var(--bg-elev) 100%); border-color: color-mix(in srgb, var(--layer-color, var(--accent)) 35%, var(--border)); }

    .pkit-arch-diagram .pkit-ad-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }
    .pkit-arch-diagram .pkit-ad-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--fg);
    }
    .pkit-arch-diagram .pkit-ad-name .lvl {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--fg-subtle);
      margin-right: 0.5rem;
    }
    .pkit-arch-diagram .pkit-ad-count {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--fg-muted);
      background: var(--bg);
      padding: 0.1rem 0.5rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .pkit-arch-diagram .pkit-ad-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .pkit-arch-diagram .pkit-ad-chip {
      padding: 0.18rem 0.55rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--fg-muted);
      cursor: help;
      transition: all 100ms ease;
      position: relative;
    }
    .pkit-arch-diagram .pkit-ad-chip:hover {
      color: var(--fg);
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .pkit-arch-diagram .pkit-ad-chip.more { font-style: italic; color: var(--fg-subtle); }

    .pkit-arch-diagram .pkit-ad-flow {
      display: flex;
      justify-content: center;
      padding: 0.1rem 0;
      color: var(--fg-subtle);
      font-size: 0.85rem;
    }
    .pkit-arch-diagram .pkit-ad-tooltip {
      position: absolute;
      background: var(--fg);
      color: var(--bg);
      padding: 0.45rem 0.7rem;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      max-width: 280px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
      z-index: 20;
      box-shadow: var(--shadow-md);
      line-height: 1.4;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      white-space: normal;
    }
    .pkit-arch-diagram .pkit-ad-chip:hover .pkit-ad-tooltip, .pkit-arch-diagram .pkit-ad-chip:focus .pkit-ad-tooltip { opacity: 1; }
  </style>

  <div class="pkit-ad-controls" data-ad-controls></div>
  <div class="pkit-ad-stack" data-ad-stack></div>
</div>

<script>
(function() {
  'use strict';
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  document.querySelectorAll('.pkit-arch-diagram[data-snippet-mount="architecture-diagram"]').forEach(diagram => {
    if (diagram.dataset.pkitInit) return;
    diagram.dataset.pkitInit = '1';
    const dataEl = diagram.querySelector('script[type="application/json"]');
    const controls = diagram.querySelector('[data-ad-controls]');
    const stack = diagram.querySelector('[data-ad-stack]');
    if (!dataEl || !controls || !stack) return;
    const layers = JSON.parse(dataEl.textContent).layers || [];

    controls.innerHTML = '<span class="pkit-ad-label">Filter layer:</span>' +
      '<button class="pkit-ad-layer-btn active" data-layer="all">All</button>' +
      layers.map((l, i) => `<button class="pkit-ad-layer-btn" data-layer="${i}"><span class="dot" style="background:${esc(l.color || 'var(--accent)')}"></span>${esc(l.name)}</button>`).join('');
    stack.innerHTML = layers.map((l, i) =>
      (i ? '<div class="pkit-ad-flow" aria-hidden="true">&#9660;</div>' : '') +
      `<div class="pkit-ad-layer" data-layer="${i}" style="--layer-color:${esc(l.color || 'var(--accent)')}">
         <div class="pkit-ad-header">
           <div class="pkit-ad-name"><span class="lvl">L${i + 1}</span>${esc(l.name)}</div>
           ${l.count ? `<div class="pkit-ad-count">${esc(l.count)}</div>` : ''}
         </div>
         <div class="pkit-ad-chips">${(l.chips || []).map(c =>
           `<span class="pkit-ad-chip" tabindex="0">${esc(c.label)}${c.tip ? `<span class="pkit-ad-tooltip">${esc(c.tip)}</span>` : ''}</span>`).join('')}</div>
       </div>`).join('');

    const btns = controls.querySelectorAll('.pkit-ad-layer-btn');
    btns.forEach(btn => btn.addEventListener('click', () => {
      btns.forEach(b => b.classList.toggle('active', b === btn));
      stack.querySelectorAll('.pkit-ad-layer').forEach(l =>
        l.classList.toggle('dimmed', btn.dataset.layer !== 'all' && l.dataset.layer !== btn.dataset.layer));
    }));
  });
})();
</script>
